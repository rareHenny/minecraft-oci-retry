name: Oracle Minecraft A1 capacity retry

on:
  schedule:
    # Every 15 minutes, offset to avoid heavy load at the top of each hour (UTC).
    - cron: '*/15 * * * *'
  workflow_dispatch:

# Needed only to disable this workflow after Oracle reports a successful apply.
permissions:
  contents: read
  actions: write

# Don't have two GitHub runners attempt the same stack concurrently.
concurrency:
  group: minecraft-oci-stack-deploy
  cancel-in-progress: false

jobs:
  retry:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Oracle SDK
        run: python -m pip install --disable-pip-version-check 'oci==2.192.0'

      - name: Check stack and retry only on capacity failure
        id: retry
        env:
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
          OCI_KEY_FINGERPRINT: ${{ secrets.OCI_KEY_FINGERPRINT }}
          OCI_API_PRIVATE_KEY: ${{ secrets.OCI_API_PRIVATE_KEY }}
          OCI_STACK_OCID: ${{ secrets.OCI_STACK_OCID }}
        run: python retry_oci.py

      - name: Disable scheduled retries after successful deployment
        if: steps.retry.outputs.deployed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/retry.yml/disable"
          echo "Disabled future retries. Check Oracle Compute > Instances."
