
name: Scheduler Test

on:
  push:
    paths:
      - '.github/workflows/schedule-test.yml'
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Verify automatic trigger
        run: |
          echo "Triggered by: ${{ github.event_name }}"
          echo "UTC time: $(date -u)"
          echo "Success!"
